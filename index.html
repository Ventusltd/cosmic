<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>202609190700-universe</title>
<style>
  :root{--ink:#e8e6e1;--dim:#8b919c;--line:#171a20}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000;
    image-rendering:pixelated}
  /* a 90s display: scanlines, and nothing smoothed anywhere */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 3px)}
  #top{position:fixed;top:0;left:0;right:0;padding:8px 12px;display:flex;gap:16px;
    align-items:baseline;flex-wrap:wrap;pointer-events:none;z-index:10}
  #name{letter-spacing:.06em}
  #count{color:var(--dim)}
  #hud{position:fixed;top:8px;right:12px;color:var(--dim);z-index:10;text-align:right}
  #foot{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;color:var(--dim);
    border-top:1px solid var(--line);background:#000c;z-index:10;line-height:1.7}
  b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><span id="name">THE UNIVERSE</span><span id="count">everything git logged</span></div>
<div id="crt"></div>
<div id="hud">starting</div>
<div id="foot">
  drag to steer &middot; scroll to zoom &middot; every particle is one line git has ever recorded &middot;
  positions are computed from the ordinal, never stored &middot; provided as is, without warranty of any
  kind; a chart, not a design
</div>
<script type="module">
// THE UNIVERSE IS EVERYTHING GIT LOGGED.
//
// 124,905,502 lines, measured 2026-09-19 by twelve self-hosted runners over every blob in git
// history, sharded deterministically by content SHA, all twelve shards present.
//
// There is NO BUFFER. A buffer of 124.9 million positions would be a gigabyte and no browser
// would accept it. Each particle's position is computed in the vertex shader from gl_VertexID
// by the estate's own placement law, so the whole universe is drawn from a single integer and
// nothing is stored. This is the second law: positions are computed, never stored.
//
// Distance is time, as in the night sky: the further out, the further into the past.
// TWO REAL NUMBERS, NEITHER STANDING FOR THE OTHER. Both measured 2026-09-19 by twelve
// self-hosted runners, all shards present.
//   DISTINCT  124,905,502  distinct lines git has recorded, copies collapsed by content
//   EVERY  37,796,045,093  every line in every file in every commit, copies counted each time
const DISTINCT = 124905502;
const EVERY    = 37796045093;
let N = EVERY;               // the default is everything. Press d for distinct.
const GOLDEN = 2.399963229728653;

const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
const hud = document.getElementById('hud');
const fmt = n => n.toLocaleString('en-GB');

if (!gl) {
  hud.textContent = 'WebGL2 is not available here. Refusing rather than drawing a fraction.';
  throw new Error('no webgl2');
}

const VS = `#version 300 es
precision highp float;
uniform float u_n;        // the whole population
uniform float u_scale;    // zoom
uniform vec2  u_pan;
uniform float u_aspect;
uniform float u_stride;   // the interleave: pass p draws every STRIDE-th particle
uniform float u_pass;
out float v_r;
void main() {
  // INTERLEAVED, NOT CONTIGUOUS. Radius is monotonic in the ordinal, so drawing k in order
  // fills outward from the centre and an unfinished exposure looks like a small disc rather
  // than a faint universe. Pass p draws k = i*STRIDE + p, so every pass spreads across the
  // whole population. After STRIDE passes every ordinal has been drawn exactly once: the
  // exposure converges on the complete set and skips nothing.
  float k = float(gl_VertexID) * u_stride + u_pass;
  if (k >= u_n) { gl_Position = vec4(2.0, 2.0, 0.0, 1.0); return; }
  // the estate's placement law, unchanged: r from the ordinal, theta by the golden angle.
  // sqrt gives uniform areal density, so the disc fills evenly rather than crowding the centre.
  float r = sqrt((k + 0.5) / u_n);
  float a = k * ${GOLDEN};
  vec2 p = vec2(cos(a), sin(a)) * r;
  v_r = r;
  p = p * u_scale + u_pan;
  p.x /= u_aspect;
  gl_Position = vec4(p, 0.0, 1.0);
  gl_PointSize = 1.0;
}`;

const FS = `#version 300 es
precision highp float;
in float v_r;
out vec4 o;
void main() {
  // BINARY. A line either exists at this position or it does not. There is no partial
  // brightness, because there is no such thing as a partial line. One or zero.
  o = vec4(0.87, 0.89, 0.86, 1.0);
}`;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());   // no attributes, no buffer, nothing uploaded

const uN = gl.getUniformLocation(prog, 'u_n');
const uS = gl.getUniformLocation(prog, 'u_scale');
const uP = gl.getUniformLocation(prog, 'u_pan');
const uA = gl.getUniformLocation(prog, 'u_aspect');
const uST = gl.getUniformLocation(prog, 'u_stride');
const uPA = gl.getUniformLocation(prog, 'u_pass');

// No blending. Alpha accumulation would manufacture brightness that no line possesses;
// coverage alone shows density, exactly as a monochrome display had to.
gl.disable(gl.BLEND);

let scale = 0.92, pan = [0, 0], drawn = 0, ms = 0;

// A single draw call of 124.9 million is refused by some drivers, so the SAME complete
// population is drawn in passes. Paging is honest: the set is unchanged. Sampling would not be.
// The exposure is interleaved. STRIDE passes, each drawing every STRIDE-th particle, so the
// first pass lands in milliseconds and already shows the whole structure; each pass after it
// adds detail. After STRIDE passes every particle has been drawn exactly once. This is
// progressive refinement, not sampling: it converges on the complete set and says so.
const STRIDE = 4096;
let pass = 0, started = 0, perFrame = 3;

function resize() {
  const d = 1;   // one device pixel per screen pixel: hard square dots, nothing smoothed
  cv.width = Math.floor(innerWidth * d);
  cv.height = Math.floor(innerHeight * d);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', () => { resize(); pass = 0; }); resize();

function frame() {
  if (pass === 0) { gl.clear(gl.COLOR_BUFFER_BIT); started = performance.now(); }
  gl.uniform1f(uN, N);
  gl.uniform1f(uS, scale);
  gl.uniform2f(uP, pan[0], pan[1]);
  gl.uniform1f(uA, cv.width / cv.height);
  gl.uniform1f(uST, STRIDE);
  const per = Math.ceil(N / STRIDE);
  const t0 = performance.now();
  let did = 0;
  while (pass < STRIDE && did < perFrame) {
    gl.uniform1f(uPA, pass);
    gl.drawArrays(gl.POINTS, 0, per);
    pass++; did++;
    if (performance.now() - t0 > 12) break;          // keep the first frame in milliseconds
  }
  const drawnNow = Math.min(N, pass * per);
  const secs = (performance.now() - started) / 1000;
  hud.textContent = pass >= STRIDE
    ? 'showing ' + fmt(N) + ' of ' + fmt(N) + ' lines · COMPLETE in ' + secs.toFixed(1) + ' s'
    : 'exposure ' + (pass / STRIDE * 100).toFixed(1) + '% · ' + fmt(drawnNow) + ' of ' + fmt(N)
      + ' lines · ' + secs.toFixed(1) + ' s';
  requestAnimationFrame(frame);
}

// changing the view restarts the render, because a half drawn universe over a new camera
// would be a picture of two different things at once.
function restart() { pass = 0; }
addEventListener('keydown', e => {
  if (e.key === 'd') { N = (N === EVERY) ? DISTINCT : EVERY; restart(); label(); }
});

function label() {
  document.getElementById('count').textContent = (N === EVERY)
    ? fmt(EVERY) + ' lines — every line in every file in every commit, copies counted each time'
      + ' · press d for ' + fmt(DISTINCT) + ' distinct'
    : fmt(DISTINCT) + ' lines — distinct content, copies collapsed'
      + ' · press d for ' + fmt(EVERY) + ' with copies';
}
label();

let drag = null;
cv.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', e => {
  if (!drag) return;
  pan[0] += (e.clientX - drag[0]) / innerWidth * 2;
  pan[1] -= (e.clientY - drag[1]) / innerHeight * 2;
  drag = [e.clientX, e.clientY];
  restart();
});
addEventListener('wheel', e => {
  scale *= e.deltaY < 0 ? 1.12 : 1 / 1.12;
  scale = Math.max(0.05, Math.min(4000, scale));
  restart();
}, { passive: true });

requestAnimationFrame(frame);
</script>
</body>
</html>
